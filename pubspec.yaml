name: portal_labs
description: >
  A curated collection of premium, zero-dependency Flutter UI components
  and experimental interactions. Built with 100% vanilla Flutter/Dart.
version: 0.21.0
homepage: https://luisportal.com/labs
repository: https://github.com/lportals/portal_labs
issue_tracker: https://github.com/lportals/portal_labs/issues

topics:
  - flutter
  - ui
  - animation
  - widgets
  - interaction

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
