<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="A curated collection of premium, zero-dependency Flutter UI components and experimental interactions. Built with 100% vanilla Flutter/Dart.">
  <meta name="author" content="Luis Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portal Labs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portal Labs · Premium UI Components</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload bootstrap to improve LCP -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    body {
      background-color: #0d0d0d; /* Premium dark background */
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background-color: #0d0d0d;
      transition: opacity 0.5s ease-out;
    }

    #loading-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-pulse {
      width: 64px;
      height: 64px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.1);
      animation: pulse 1.5s infinite ease-in-out;
      margin-bottom: 24px;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .loading-text {
      color: rgba(255, 255, 255, 0.7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Native HTML placeholder for Lighthouse LCP and better UX -->
  <div id="loading-container">
    <div class="loader-pulse"></div>
    <h1 class="loading-text">Portal Labs</h1>
  </div>

  <script>
    // Remove the native loader once Flutter has rendered its first frame
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
