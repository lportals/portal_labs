name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
  release:
    types: [published]

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Quality Gate (runs on every push/PR)
  # ─────────────────────────────────────────────────
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Dart analyze (zero warnings policy)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test --reporter=github

      - name: Pub publish dry-run (0 warnings check)
        run: dart pub publish --dry-run

  # ─────────────────────────────────────────────────
  # JOB 2: Publish to pub.dev (runs only on GitHub Release)
  # ─────────────────────────────────────────────────
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # Required for OIDC auth with pub.dev

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev (via OIDC - no token needed)
        run: dart pub publish --force
